server {
    listen 80;
    listen [::]:80;
    server_name captei.shop www.captei.shop;
    return 301 https://captei.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.captei.shop;
    ssl_certificate /etc/letsencrypt/live/captei.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/captei.shop/privkey.pem;
    return 301 https://captei.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name captei.shop;

    ssl_certificate     /etc/letsencrypt/live/captei.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/captei.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass         http://127.0.0.1:8100;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass       http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /dstatic/ {
        proxy_pass       http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        proxy_pass       http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /var/www/captei.shop;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* ^(?!/dstatic|/media|/api|/admin).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /var/www/captei.shop;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
